function fd(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function jp(d){let w='日月火水木金土'[d.getDay()];return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`}
function tm(iso){if(!iso)return '—';let d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function isoForDate(dateStr,baseIso){let d=fd(dateStr),b=baseIso?new Date(baseIso):new Date();d.setHours(b.getHours(),b.getMinutes(),b.getSeconds(),b.getMilliseconds());return d.toISOString()}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderMaster(){
  let radio=String(st?.radio||'').trim(),v=VM[radio],box=$('master');
  if(!radio||!v){box.classList.remove('on');$('masterMembers').innerHTML='';$('timeChoices').innerHTML='';$('masterWarn').textContent='';return}
  box.classList.add('on');
  $('masterTeam').textContent=`${v.team}　無線 ${v.radioNumber}`;
  $('masterMembers').innerHTML=v.members.map(m=>`<div class="member"><div class="ecode">${esc(m.employeeCode)}</div><div class="mname">${esc(m.name)}</div><div class="mtime">${esc(m.baseDepartureTime||'—')}</div></div>`).join('');
  let times=[...new Set(v.members.map(m=>m.baseDepartureTime).filter(t=>/^\d{1,2}:\d{2}$/.test(t||'')))];
  $('timeChoices').innerHTML=times.map(t=>`<button type="button" class="timeChoice" data-time="${esc(t.padStart(5,'0'))}">${esc(t)}</button>`).join('');
  $('masterWarn').textContent=times.length>1?'次回出庫は候補からタップして選択してください。':times.length===1?'この時間をタップすると「次回出庫」に入ります。':'基本出庫時間は確認できません。次回出庫を手入力してください。';
  document.querySelectorAll('.timeChoice').forEach(b=>{
  b.onclick=(ev)=>{
    ev.preventDefault();ev.stopPropagation();
    const t=String(b.dataset.time||'').trim();
    const parts=t.split(':');
    const normalized=parts.length===2?String(parts[0]).padStart(2,'0')+':'+parts[1]:t;
    st.dep=normalized;
    $('dep').value=normalized;
    localStorage.wDep=normalized;
    document.querySelectorAll('.timeChoice').forEach(x=>x.classList.toggle('selected',x===b));
  };
});
}

function fresh(keepDate=true){let keep=keepDate&&st?.receptionDate?st.receptionDate:today();st={id:null,radio:'',dep:localStorage.wDep||'06:30',start:localStorage.wStart||'02:00',end:localStorage.wEnd||'06:00',memo:'',seatCover:false,amount:1300,status:'received',receivedAt:null,receptionDate:keep};render()}
function render(){$('receptionDate').value=st.receptionDate||today();$('num').value=st.radio;$('dep').value=st.dep;$('start').value=st.start;$('end').value=st.end;$('memo').value=st.memo||'';$('cover').checked=!!st.seatCover;st.amount=1300+(st.seatCover?200:0);$('amount').textContent=Number(st.amount||1300).toLocaleString('ja-JP')+'円';$('preview').textContent=st.radio||'—';$('status').style.background=C[st.status];$('status').style.color=['unpaid','cancelled'].includes(st.status)?'#303438':'#fff';localStorage.wDep=st.dep;localStorage.wStart=st.start;localStorage.wEnd=st.end;renderMaster()}
function sync(){st.receptionDate=$('receptionDate').value||st.receptionDate||today();st.radio=$('num').value.trim();st.dep=$('dep').value||st.dep;st.start=$('start').value||st.start;st.end=$('end').value||st.end;st.memo=$('memo').value.trim();st.seatCover=$('cover').checked;st.amount=1300+(st.seatCover?200:0);render()}
function H(extra={}){return {apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json',...extra}}
async function api(path,o={}){let r=await fetch(`${U}/rest/v1/${path}`,{...o,headers:H(o.headers||{})});if(!r.ok)throw Error(await r.text());let x=await r.text();return x?JSON.parse(x):null}
async function insert(){let n=isoForDate(st.receptionDate),changed=new Date().toISOString(),a=await api('wash_receptions',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({radio_number:st.radio,departure_time:st.dep,service_start:st.start,service_end:st.end,memo:st.memo||'',seat_cover:!!st.seatCover,amount:st.amount||1300,status:st.status,received_at:n,status_changed_at:changed})});if(a?.[0]){st.id=a[0].id;st.receivedAt=a[0].received_at}}
async function update(){if(!st.id)return;let n=new Date().toISOString(),received=isoForDate(st.receptionDate,st.receivedAt);await api(`wash_receptions?id=eq.${encodeURIComponent(st.id)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({radio_number:st.radio,departure_time:st.dep,service_start:st.start,service_end:st.end,memo:st.memo||'',seat_cover:!!st.seatCover,amount:st.amount||1300,status:st.status,received_at:received,status_changed_at:n})});st.receivedAt=received}
$('newBtn').onclick=()=>{fresh(true);$('num').focus()};$('receptionDate').onchange=sync;
let radioComposing=false;
function normalizeRadio(){
  const el=$('num');
  const normalized=String(el.value||'')
    .replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0))
    .replace(/[^0-9]/g,'');
  if(el.value!==normalized)el.value=normalized;
  sync();
}
$('num').addEventListener('compositionstart',()=>{radioComposing=true});
$('num').addEventListener('compositionend',()=>{radioComposing=false;normalizeRadio()});
$('num').addEventListener('input',()=>{if(!radioComposing)normalizeRadio()});
$('dep').onchange=sync;$('start').onchange=sync;$('end').onchange=sync;$('memo').oninput=()=>{st.memo=$('memo').value};$('cover').onchange=sync;$('status').onclick=()=>$('sheet').classList.add('on');$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').classList.remove('on')};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{st.status=b.dataset.s;render();$('sheet').classList.remove('on');try{await update()}catch(e){alert('状態を保存できませんでした')}});
$('deleteBtn').onclick=async()=>{if(!st.id){$('sheet').classList.remove('on');return}if(!confirm(`無線番号 ${st.radio} の受付データを削除しますか？\nこの操作は元に戻せません。`))return;let b=$('deleteBtn'),old=b.textContent;b.disabled=true;b.textContent='削除中…';try{await api(`wash_receptions?id=eq.${encodeURIComponent(st.id)}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});$('sheet').classList.remove('on');alert('受付データを削除しました');fresh(true);sel=today();$('date').value=sel;$('editor').classList.add('hide');$('list').classList.remove('hide');await refresh()}catch(e){console.error(e);alert('削除できませんでした。SupabaseのDELETE権限も確認してください')}finally{b.disabled=false;b.textContent=old}};
$('save').onclick=async()=>{sync();if(!st.radio){$('num').focus();return}let b=$('save'),old=b.textContent;b.disabled=true;b.textContent='保存中…';try{st.id?await update():await insert();$('dispDate').textContent=jp(fd(st.receptionDate));$('dispTime').textContent=`${st.start.replace(/^0/,'')}〜${st.end.replace(/^0/,'')}`;$('editor').classList.add('hide');$('display').classList.remove('hide')}catch(e){console.error(e);alert('受付データを保存できませんでした')}finally{b.disabled=false;b.textContent=old}};
$('displayCard').onclick=()=>{$('display').classList.add('hide');$('editor').classList.remove('hide');fresh(true)};
function range(s){let a=fd(s),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1);return [a.toISOString(),b.toISOString()]}
async function refresh(){let [a,b]=range(sel);$('listDate').textContent=jp(fd(sel));try{rows=await api(`wash_receptions?select=id,radio_number,departure_time,service_start,service_end,memo,seat_cover,amount,status,received_at,status_changed_at&received_at=gte.${encodeURIComponent(a)}&received_at=lt.${encodeURIComponent(b)}&order=received_at.asc`,{method:'GET'});draw()}catch(e){$('rows').innerHTML='<div class="empty">読み込みできませんでした</div>'}}
async function deleteFromList(r,ev){
  ev.stopPropagation();
  if(!confirm(`無線番号 ${String(r.radio_number||'')} の受付データを削除しますか？\nこの操作は元に戻せません。`))return;
  let btn=ev.currentTarget,old=btn.textContent;btn.disabled=true;btn.textContent='削除中';
  try{
    await api(`wash_receptions?id=eq.${encodeURIComponent(r.id)}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});
    await refresh();
  }catch(e){
    console.error(e);alert('削除できませんでした');
    btn.disabled=false;btn.textContent=old;
  }
}
function draw(){
  let q=$('search').value.trim(),f=$('filter').value;
  const receptionOrder=[...rows].sort((x,y)=>new Date(x.received_at)-new Date(y.received_at));
  const receiptNo=new Map(receptionOrder.map((r,i)=>[String(r.id),i+1]));
  let a=rows.filter(r=>(!q||String(r.radio_number||'').includes(q))&&(f==='all'||r.status===f));
  const depKey=r=>String(r.departure_time||'99:99').slice(0,5);
  a.sort((x,y)=>{
    if(sortMode==='receptionDesc')return new Date(y.received_at)-new Date(x.received_at);
    if(sortMode==='radioAsc')return Number(x.radio_number||0)-Number(y.radio_number||0)||new Date(x.received_at)-new Date(y.received_at);
    if(sortMode==='departureAsc')return depKey(x).localeCompare(depKey(y))||new Date(x.received_at)-new Date(y.received_at);
    return new Date(x.received_at)-new Date(y.received_at);
  });
  let c={received:0,completed:0,paid:0,unpaid:0,cancelled:0};rows.forEach(r=>{if(c[r.status]!==undefined)c[r.status]++});
  $('stats').innerHTML=`<span class="pill">全 ${rows.length}</span><span class="pill g">受付 ${c.received}</span><span class="pill c">完了 ${c.completed}</span><span class="pill b">済 ${c.paid}</span><span class="pill y">未収 ${c.unpaid}</span><span class="pill p">取消 ${c.cancelled}</span>`;
  $('rows').innerHTML='';
  if(!a.length){$('rows').innerHTML='<div class="empty">該当する受付はありません</div>';return}
  a.forEach(r=>{
    let e=document.createElement('div');e.className='row';
    const no=receiptNo.get(String(r.id))||'—';
    e.innerHTML=`<div class="dot" style="background:${C[r.status]||'#999'}"></div><div><div><span class="receiptNo">#${no}</span><span class="rn">${String(r.radio_number||'')}</span></div><div class="statusLabel">${L[r.status]||r.status}</div><div class="meta">受付 ${tm(r.received_at)}　変更 ${tm(r.status_changed_at||r.received_at)}</div><div class="rowExtra">${r.seat_cover?'<span class="tag">シートカバー</span>':''}<b>${Number(r.amount||1300).toLocaleString('ja-JP')}円</b>${r.memo?'<br>📝 '+esc(r.memo):''}</div></div><div class="dep"><span class="meta">次回出庫</span><br><b>${(r.departure_time||'').slice(0,5).replace(/^0/,'')}</b></div><button type="button" class="rowDelete">削除</button>`;
    e.querySelector('.rowDelete').onclick=(ev)=>deleteFromList(r,ev);
    e.onclick=()=>{st={id:r.id,radio:String(r.radio_number||''),dep:(r.departure_time||'06:30').slice(0,5),start:(r.service_start||localStorage.wStart||'02:00').slice(0,5),end:(r.service_end||localStorage.wEnd||'06:00').slice(0,5),memo:r.memo||'',seatCover:!!r.seat_cover,amount:Number(r.amount||1300),status:r.status||'received',receivedAt:r.received_at,receptionDate:ymd(new Date(r.received_at))};render();$('list').classList.add('hide');$('editor').classList.remove('hide')};
    $('rows').appendChild(e)
  })
}
$('listBtn').onclick=()=>{sel=today();$('date').value=sel;$('sort').value=sortMode;$('editor').classList.add('hide');$('list').classList.remove('hide');refresh()};$('back').onclick=()=>{$('list').classList.add('hide');$('editor').classList.remove('hide');fresh(true)};function shift(n){let d=fd(sel);d.setDate(d.getDate()+n);sel=ymd(d);$('date').value=sel;refresh()}$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('date').onchange=()=>{sel=$('date').value;refresh()};$('search').oninput=draw;$('filter').onchange=draw;$('sort').onchange=()=>{sortMode=$('sort').value;localStorage.wSort=sortMode;draw()};$('sort').value=sortMode;fresh(false);
</script></body></html>
