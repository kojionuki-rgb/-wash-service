<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>洗車サービス</title><style>
:root{--c:#303438;--bg:#f6f6f3;--line:#d9dde1;--g:#48d75a;--b:#31a9ef;--y:#ffd84d;--p:#ff9fbd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--c)}
button,input,select{font:inherit}.hide{display:none!important}main{max-width:540px;margin:auto;padding:16px}.card{background:#fff;border:1.5px solid #a3a9af;border-radius:28px;padding:18px}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:16px}.title{font-size:28px;font-weight:900}.actions{display:flex;gap:6px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 10px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.f label{display:block;font-size:12px;color:#858b91;font-weight:800;margin:0 0 5px 3px}.f input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:17px;font-weight:800}
.status{margin-top:18px;border-radius:24px;padding:18px;cursor:pointer}.num{font-size:76px;text-align:center;font-weight:950}.note{text-align:center;color:#999;font-size:11px;margin-top:8px}
.primary{width:100%;border:0;border-radius:14px;padding:15px;background:var(--c);color:#fff;font-weight:900;font-size:17px;margin-top:16px}
.confirm{text-align:center;padding:22px 0}.block{padding:26px 4px;border-bottom:1px solid var(--line)}.label{font-size:18px;color:#92989e;font-weight:800}.date{font-size:29px;font-weight:900;margin-top:10px}.time{font-size:52px;font-weight:950;margin-top:10px}
.tools{display:grid;grid-template-columns:auto 1fr auto;gap:7px;margin:14px 0}.tools input,.filter input,.filter select{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:800}.filter{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stats{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.pill{font-size:11px;font-weight:900;padding:6px 8px;border-radius:999px;background:#eee}.row{display:grid;grid-template-columns:9px 1fr auto;gap:10px;align-items:center;border:1px solid #e2e5e8;border-radius:16px;padding:13px;margin:9px 0;cursor:pointer}.dot{width:9px;height:52px;border-radius:7px}.rn{font-size:25px;font-weight:950}.meta{font-size:11px;color:#92989e;font-weight:800}.dep{text-align:right}.empty{text-align:center;padding:30px;color:#999}
.sheet{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;justify-content:center;padding:16px}.sheet.on{display:flex}.sheetbox{background:#fff;width:min(430px,100%);padding:16px;border-radius:22px}.opt{width:100%;border:0;border-radius:14px;padding:15px;margin:5px 0;text-align:left;font-weight:900}.g{background:#ddf8e2}.b{background:#dff2ff}.y{background:#fff4bd}.p{background:#ffd6e3}
@media(max-width:390px){.grid,.filter{grid-template-columns:1fr}.title{font-size:25px}.time{font-size:44px}}
</style></head><body>
<main id="editor"><section class="card"><div class="head"><div class="title">🚕 洗車サービス</div><div class="actions"><button id="newBtn" class="btn">新規</button><button id="listBtn" class="btn">受付リスト</button></div></div>
<div class="grid"><div class="f"><label>無線番号</label><input id="num" inputmode="numeric" placeholder="無線番号"></div><div class="f"><label>次回出庫</label><input id="dep" type="time"></div></div>
<div class="grid"><div class="f"><label>洗車対応 開始</label><input id="start" type="time"></div><div class="f"><label>洗車対応 終了</label><input id="end" type="time"></div></div>
<div id="status" class="status"><b>無線番号</b><div id="preview" class="num">—</div></div><div class="note">無線番号カードをタップして状態変更</div>
<button id="save" class="primary">受付して依頼者に見せる</button></section></main>
<main id="display" class="hide"><section id="displayCard" class="card"><div class="head"><div class="title">🚕 洗車サービス</div><b>受付しました</b></div><div class="confirm"><div class="block"><div class="label">洗車受付日</div><div id="dispDate" class="date"></div></div><div class="block"><div class="label">洗車対応時間</div><div id="dispTime" class="time"></div></div></div><div class="note">画面をタップすると受付画面に戻ります</div></section></main>
<main id="list" class="hide"><section class="card"><div class="head"><div><div class="title">受付リスト</div><div id="listDate" class="meta"></div></div><button id="back" class="btn">戻る</button></div><div class="tools"><button id="prev" class="btn">‹</button><input id="date" type="date"><button id="next" class="btn">›</button></div><div class="filter"><input id="search" type="search" placeholder="無線番号で検索"><select id="filter"><option value="all">すべて</option><option value="received">受付</option><option value="paid">支払い済み</option><option value="unpaid">未収</option><option value="cancelled">キャンセル</option></select></div><div id="stats" class="stats"></div><div id="rows"></div></section></main>
<div id="sheet" class="sheet"><div class="sheetbox"><h3>状態を変更</h3><button class="opt g" data-s="received">受付（緑）</button><button class="opt b" data-s="paid">支払い済み（青）</button><button class="opt y" data-s="unpaid">未収（黄）</button><button class="opt p" data-s="cancelled">キャンセル（ピンク）</button></div></div>
<script>
const U='https://vqokuktwqrhxsvkwgyug.supabase.co',K='sb_publishable_dMrMp7HYQNxF0KlxrJHEPA_NJBgXR4n',$=x=>document.getElementById(x);
const C={received:'#48d75a',paid:'#31a9ef',unpaid:'#ffd84d',cancelled:'#ff9fbd'},L={received:'受付',paid:'支払い済み',unpaid:'未収',cancelled:'キャンセル'};
let st,rows=[],sel=today();
function fresh(){st={id:null,radio:'',dep:localStorage.wDep||'06:30',start:localStorage.wStart||'02:00',end:localStorage.wEnd||'06:00',status:'received',receivedAt:null};render()}
function render(){$('num').value=st.radio;$('dep').value=st.dep;$('start').value=st.start;$('end').value=st.end;$('preview').textContent=st.radio||'—';$('status').style.background=C[st.status];$('status').style.color=['unpaid','cancelled'].includes(st.status)?'#303438':'#fff';localStorage.wDep=st.dep;localStorage.wStart=st.start;localStorage.wEnd=st.end}
function sync(){st.radio=$('num').value.trim();st.dep=$('dep').value||st.dep;st.start=$('start').value||st.start;st.end=$('end').value||st.end;render()}
function H(extra={}){return{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json',...extra}}
async function api(path,o={}){let r=await fetch(`${U}/rest/v1/${path}`,{...o,headers:H(o.headers||{})});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}
function ymd(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function today(){return ymd(new Date())}function fd(s){let[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function jp(d){let w='日月火水木金土'[d.getDay()];return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w}）`}function t(iso){if(!iso)return'—';let d=new Date(iso);return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
async function insert(){let n=new Date().toISOString(),a=await api('wash_receptions',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({radio_number:st.radio,departure_time:st.dep,service_start:st.start,service_end:st.end,status:st.status,received_at:n,status_changed_at:n})});if(a?.[0]){st.id=a[0].id;st.receivedAt=a[0].received_at}}
async function update(){if(!st.id)return;let n=new Date().toISOString();await api(`wash_receptions?id=eq.${encodeURIComponent(st.id)}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({radio_number:st.radio,departure_time:st.dep,service_start:st.start,service_end:st.end,status:st.status,status_changed_at:n})})}
$('newBtn').onclick=()=>{fresh();$('num').focus()};$('num').oninput=sync;$('dep').onchange=sync;$('start').onchange=sync;$('end').onchange=sync;$('status').onclick=()=> $('sheet').classList.add('on');$('sheet').onclick=e=>{if(e.target===$('sheet'))$('sheet').classList.remove('on')};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{st.status=b.dataset.s;render();$('sheet').classList.remove('on');try{await update()}catch(e){alert('状態を保存できませんでした')}});
$('save').onclick=async()=>{sync();if(!st.radio){$('num').focus();return}let b=$('save'),old=b.textContent;b.disabled=true;b.textContent='保存中…';try{st.id?await update():await insert();$('dispDate').textContent=jp(st.receivedAt?new Date(st.receivedAt):new Date());$('dispTime').textContent=`${st.start.replace(/^0/,'')}〜${st.end.replace(/^0/,'')}`;$('editor').classList.add('hide');$('display').classList.remove('hide')}catch(e){alert('受付データを保存できませんでした')}finally{b.disabled=false;b.textContent=old}};
$('displayCard').onclick=()=>{$('display').classList.add('hide');$('editor').classList.remove('hide');fresh()};
function range(s){let a=fd(s),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1);return[a.toISOString(),b.toISOString()]}
async function refresh(){let[a,b]=range(sel);$('listDate').textContent=jp(fd(sel));try{rows=await api(`wash_receptions?select=id,radio_number,departure_time,service_start,service_end,status,received_at,status_changed_at&received_at=gte.${encodeURIComponent(a)}&received_at=lt.${encodeURIComponent(b)}&order=received_at.desc`,{method:'GET'});draw()}catch(e){$('rows').innerHTML='<div class="empty">読み込みできませんでした</div>'}}
function draw(){let q=$('search').value.trim(),f=$('filter').value,a=rows.filter(r=>(!q||String(r.radio_number||'').includes(q))&&(f==='all'||r.status===f)),c={received:0,paid:0,unpaid:0,cancelled:0};rows.forEach(r=>c[r.status]++);$('stats').innerHTML=`<span class="pill">全 ${rows.length}</span><span class="pill g">受付 ${c.received}</span><span class="pill b">済 ${c.paid}</span><span class="pill y">未収 ${c.unpaid}</span><span class="pill p">取消 ${c.cancelled}</span>`;$('rows').innerHTML='';if(!a.length){$('rows').innerHTML='<div class="empty">該当する受付はありません</div>';return}a.forEach(r=>{let e=document.createElement('div');e.className='row';e.innerHTML=`<div class="dot" style="background:${C[r.status]}"></div><div><div><span class="rn">${String(r.radio_number||'')}</span> <b>${L[r.status]}</b></div><div class="meta">受付 ${t(r.received_at)}　変更 ${t(r.status_changed_at||r.received_at)}</div></div><div class="dep"><span class="meta">次回出庫</span><br><b>${(r.departure_time||'').slice(0,5).replace(/^0/,'')}</b></div>`;e.onclick=()=>{st={id:r.id,radio:String(r.radio_number||''),dep:(r.departure_time||'06:30').slice(0,5),start:(r.service_start||localStorage.wStart||'02:00').slice(0,5),end:(r.service_end||localStorage.wEnd||'06:00').slice(0,5),status:r.status||'received',receivedAt:r.received_at};render();$('list').classList.add('hide');$('editor').classList.remove('hide')};$('rows').appendChild(e)})}
$('listBtn').onclick=()=>{sel=today();$('date').value=sel;$('editor').classList.add('hide');$('list').classList.remove('hide');refresh()};$('back').onclick=()=>{$('list').classList.add('hide');$('editor').classList.remove('hide');fresh()};function shift(n){let d=fd(sel);d.setDate(d.getDate()+n);sel=ymd(d);$('date').value=sel;refresh()}$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('date').onchange=()=>{sel=$('date').value;refresh()};$('search').oninput=draw;$('filter').onchange=draw;fresh();
</script></body></html>
