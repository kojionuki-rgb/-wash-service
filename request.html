<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>洗車予約</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f5;color:#303438;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.w{max-width:460px;margin:auto;padding:16px 14px 38px}.c{background:#fff;border:1px solid #d6dade;border-radius:28px;padding:20px 17px}h1{font-size:27px;margin:0}.lead{color:#92999f;font-size:13px;line-height:1.6;margin:5px 0 0}.legend{display:flex;gap:13px;flex-wrap:wrap;margin:17px 0 8px;font-size:12px;color:#858c91;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.green{background:#50d967}.gray{background:#d8dcdf}.head{display:flex;justify-content:space-between;align-items:center;margin:13px 0 9px}.nav{width:44px;height:44px;border:1px solid #dde1e4;border-radius:13px;background:#fff;font-size:20px}.month{font-weight:900}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:11px;color:#a0a6ab;padding:4px 0}.day{min-height:58px;border:1px solid #e3e6e8;border-radius:12px;background:#fafafa;color:#b5babd;font-weight:900}.day.open{background:#effaf1;color:#303438;border-color:#c7e7cd}.day.sel{outline:3px solid #303438}.day small{display:block;font-size:9px;font-weight:800;margin-top:3px}.status{margin:14px 0;padding:13px 14px;border-radius:15px;background:#f3f4f4;color:#8e959a;font-size:13px;font-weight:800}.status.open{background:#effaf1;color:#52765a}.form{display:none}.form.on{display:block}label{display:block;margin:13px 4px 7px;color:#7f868c;font-size:13px;font-weight:800}input,textarea{width:100%;border:1px solid #dde1e4;border-radius:14px;padding:14px;font-size:17px;background:#fff}textarea{min-height:78px;resize:vertical}.option{display:flex;align-items:center;gap:10px;margin-top:14px;padding:13px;border:1px solid #e1e4e6;border-radius:15px}.option input{width:22px;height:22px}.price{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid #e6e8e9;font-weight:900}.send{width:100%;border:0;border-radius:16px;padding:16px;margin-top:17px;background:#50d967;color:#fff;font-size:18px;font-weight:900}.send:disabled{opacity:.5}.ok,.err{display:none;margin-top:13px;padding:13px;border-radius:14px;text-align:center;font-weight:800}.ok.on{display:block;background:#effaf1}.err.on{display:block;background:#fff0f0;color:#c84d4d}.note{text-align:center;color:#a1a7ac;font-size:11px;margin-top:14px;line-height:1.6}
</style></head><body><div class="w"><div class="c"><h1>🚕✨ 洗車予約</h1><div class="lead">カレンダーで受付状況を確認できます。<br>「受付可」の日をタップしてご依頼ください。</div>
<div class="legend"><span><i class="dot green"></i>受付可</span><span><i class="dot gray"></i>お休み・受付なし</span></div>
<div class="head"><button id="prev" class="nav">‹</button><div id="month" class="month"></div><button id="next" class="nav">›</button></div>
<div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="grid" class="grid"></div>
<div id="status" class="status">日付を選ぶと受付状況を確認できます。</div>
<div id="form" class="form">
<label>無線番号</label><input id="radio" inputmode="numeric" placeholder="例：1234">
<label>次回出庫</label><input id="dep" type="time" value="06:30">
<label>洗車メモ</label><textarea id="memo" placeholder="例：後部座席を念入りに"></textarea>
<label class="option"><input id="cover" type="checkbox"><span><b>シートカバー交換</b><br><span style="color:#999;font-size:12px">＋200円</span></span></label>
<div class="price"><span>料金</span><span id="price">1,300円</span></div>
<button id="send" class="send">洗車を依頼する</button>
</div><div id="ok" class="ok"></div><div id="err" class="err">登録できませんでした。通信状態を確認してください。</div>
<div class="note">受付可能日は管理者のカレンダー設定と連動します。</div></div></div>
<script>
const U='https://vqokuktwqrhxsvkwgyug.supabase.co',K='sb_publishable_dMrMp7HYQNxF0KlxrJHEPA_NJBgXR4n',$=x=>document.getElementById(x);let cur=new Date(),slots=[],selected=null;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function api(path,opt={}){let r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function load(){let a=ymd(new Date(cur.getFullYear(),cur.getMonth(),1)),b=ymd(new Date(cur.getFullYear(),cur.getMonth()+1,0));try{slots=await api('wash_available_days?select=wash_date,is_open,capacity&wash_date=gte.'+a+'&wash_date=lte.'+b)}catch(e){slots=[]}render()}
function render(){$('month').textContent=cur.getFullYear()+'年 '+(cur.getMonth()+1)+'月';let f=new Date(cur.getFullYear(),cur.getMonth(),1),l=new Date(cur.getFullYear(),cur.getMonth()+1,0),h='';for(let i=0;i<f.getDay();i++)h+='<span></span>';for(let n=1;n<=l.getDate();n++){let s=ymd(new Date(cur.getFullYear(),cur.getMonth(),n)),x=slots.find(v=>v.wash_date===s),open=x&&x.is_open!==false;h+=`<button class="day ${open?'open':''} ${selected===s?'sel':''}" data-d="${s}" data-open="${open}">${n}<small>${open?'受付可':'お休み'}</small></button>`}$('grid').innerHTML=h;document.querySelectorAll('.day').forEach(b=>b.onclick=()=>choose(b.dataset.d,b.dataset.open==='true'))}
function choose(d,open){selected=d;$('ok').classList.remove('on');$('err').classList.remove('on');if(open){$('status').className='status open';$('status').textContent=d+'　受付できます';$('form').classList.add('on')}else{$('status').className='status';$('status').textContent=d+'　お休み／受付していません';$('form').classList.remove('on')}render()}
$('prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);selected=null;$('form').classList.remove('on');load()};$('next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);selected=null;$('form').classList.remove('on');load()};
$('cover').onchange=()=>$('price').textContent=$('cover').checked?'1,500円':'1,300円';
$('send').onclick=async()=>{let n=$('radio').value.trim(),dep=$('dep').value,memo=$('memo').value.trim(),cover=$('cover').checked;if(!n){$('radio').focus();return}let now=new Date().toISOString(),amount=1300+(cover?200:0),b=$('send');b.disabled=true;b.textContent='登録中…';try{await api('wash_receptions',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({radio_number:n,departure_time:dep,status:'received',received_at:now,status_changed_at:now,wash_date:selected,memo:memo,seat_cover:cover,amount:amount})});$('ok').textContent='無線番号 '+n+' の洗車依頼を受け付けました';$('ok').classList.add('on');$('radio').value='';$('memo').value='';$('cover').checked=false;$('price').textContent='1,300円'}catch(e){console.error(e);$('err').classList.add('on')}finally{b.disabled=false;b.textContent='洗車を依頼する'}};
load();
</script></body></html>
