<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f5">
<title>洗車依頼</title>
<style>
:root{--c:#303438;--m:#92989e;--l:#dde1e4;--g:#56dc62;--bg:#f6f7f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--c);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:460px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border:1px solid #cfd4d8;border-radius:28px;padding:22px 18px}
.head{display:flex;align-items:center;gap:13px;padding-bottom:20px;border-bottom:1px solid var(--l)}
.icon{font-size:42px}.title{font-size:30px;font-weight:900}.sub{margin:20px 2px 14px;color:#7f868c;font-size:14px;font-weight:700;line-height:1.7}
.field{margin-top:14px}label{display:block;margin:0 0 7px 4px;color:#7f868c;font-size:13px;font-weight:800}
input{width:100%;border:1px solid var(--l);border-radius:14px;padding:15px 14px;background:#fff;color:var(--c);font-size:20px;font-weight:800;outline:none}
button{width:100%;margin-top:20px;border:0;border-radius:16px;padding:16px;background:var(--g);color:#fff;font-size:18px;font-weight:900}
button:disabled{opacity:.55}.note{text-align:center;color:#a0a6ac;font-size:12px;line-height:1.6;margin-top:12px}
.confirm{display:none;text-align:center}.confirm.show{display:block}.form.hide{display:none}
.ok{width:74px;height:74px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;margin:4px auto 18px}
.confirm h2{font-size:27px;margin:0 0 6px}.confirm p{color:#8b9197;margin:0 0 20px;font-weight:700}
.summary{border-radius:22px;background:#f4f7f4;padding:18px;text-align:left}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #e3e6e4}.row:last-child{border-bottom:0}
.k{color:#8e959b;font-size:13px;font-weight:800}.v{font-size:22px;font-weight:900}.reset{background:#eef0f1;color:var(--c)}
.err{display:none;margin-top:12px;color:#d44848;font-size:13px;font-weight:800;text-align:center}.err.show{display:block}
</style>
</head>
<body>
<div class="wrap"><section class="card">
<div class="head"><div class="icon">🚕✨</div><div class="title">洗車依頼</div></div>

<div id="formView" class="form">
<div class="sub">無線番号と次回の出庫時刻を入力してください。</div>
<div class="field"><label for="radio">無線番号</label><input id="radio" inputmode="numeric" autocomplete="off" placeholder="例：1234"></div>
<div class="field"><label for="dep">次回出庫</label><input id="dep" type="time" value="06:30"></div>
<button id="send">洗車を依頼する</button>
<div id="err" class="err">送信できませんでした。通信状態を確認してください。</div>
<div class="note">送信すると洗車受付リストに登録されます。</div>
</div>

<div id="confirmView" class="confirm">
<div class="ok">✓</div><h2>洗車依頼を受け付けました</h2><p>ご依頼ありがとうございます。</p>
<div class="summary">
<div class="row"><span class="k">無線番号</span><span id="cRadio" class="v">—</span></div>
<div class="row"><span class="k">次回出庫</span><span id="cDep" class="v">—</span></div>
<div class="row"><span class="k">受付時刻</span><span id="cTime" class="v">—</span></div>
</div>
<button id="reset" class="reset">別の洗車を依頼する</button>
</div>
</section></div>

<script>
const U='https://vqokuktwqrhxsvkwgyug.supabase.co';
const K='sb_publishable_dMrMp7HYQNxF0KlxrJHEPA_NJBgXR4n';
const $=id=>document.getElementById(id);
$('radio').addEventListener('focus',e=>e.target.select());

$('send').addEventListener('click',async()=>{
 const radio=$('radio').value.trim(), dep=$('dep').value;
 if(!radio){$('radio').focus();return}
 if(!dep){$('dep').focus();return}
 const b=$('send'); b.disabled=true; b.textContent='送信中…'; $('err').classList.remove('show');
 try{
  const now=new Date().toISOString();
  const r=await fetch(U+'/rest/v1/wash_receptions',{
   method:'POST',
   headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},
   body:JSON.stringify({radio_number:radio,departure_time:dep,status:'received',received_at:now,status_changed_at:now})
  });
  if(!r.ok) throw new Error(await r.text());
  const d=new Date();
  $('cRadio').textContent=radio;
  $('cDep').textContent=dep.replace(/^0/,'');
  $('cTime').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('formView').classList.add('hide'); $('confirmView').classList.add('show'); scrollTo(0,0);
 }catch(e){console.error(e);$('err').classList.add('show')}
 finally{b.disabled=false;b.textContent='洗車を依頼する'}
});
$('reset').addEventListener('click',()=>{$('radio').value='';$('confirmView').classList.remove('show');$('formView').classList.remove('hide');$('radio').focus()});
</script>
</body></html>
