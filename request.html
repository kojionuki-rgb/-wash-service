<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>洗車依頼</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f7f5;color:#303438;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.w{max-width:460px;margin:auto;padding:18px 14px}.c{background:#fff;border:1px solid #d5d9dc;border-radius:28px;padding:22px 18px}.h{font-size:29px;font-weight:900;padding-bottom:18px;border-bottom:1px solid #dde1e4}.s{margin:18px 2px;color:#7f868c;font-size:14px;font-weight:700;line-height:1.6}label{display:block;margin:13px 4px 7px;color:#7f868c;font-size:13px;font-weight:800}input{width:100%;border:1px solid #dde1e4;border-radius:14px;padding:15px 14px;font-size:20px;font-weight:800}button{width:100%;margin-top:18px;border:0;border-radius:16px;padding:16px;background:#56dc62;color:#fff;font-size:18px;font-weight:900}button:disabled{opacity:.5}.ok{display:none;margin-top:14px;padding:14px;border-radius:16px;background:#effaf1;text-align:center;font-weight:900}.ok.on{display:block}.err{display:none;color:#d44848;text-align:center;margin-top:12px;font-weight:800}.err.on{display:block}.list{margin-top:20px;border-top:1px solid #dde1e4;padding-top:16px}.lh{display:flex;justify-content:space-between;font-weight:900}.count{background:#eef0f1;border-radius:999px;padding:5px 9px;font-size:13px}.empty{text-align:center;color:#a0a6ac;font-size:13px;padding:18px}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid #eceeef}.num{font-size:22px;font-weight:900}.meta{font-size:12px;color:#91979c;font-weight:700;margin-top:3px}.badge{background:#ddf8e2;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900}</style></head>
<body><div class="w"><div class="c"><div class="h">🚕✨ 洗車依頼</div><div class="s">1台ずつ登録できます。送信後、そのまま次の車両を続けて登録できます。</div>
<label>無線番号</label><input id="radio" inputmode="numeric" autocomplete="off" placeholder="例：1234"><label>次回出庫</label><input id="dep" type="time" value="06:30"><button id="send">この車両を登録する</button><div id="ok" class="ok"></div><div id="err" class="err">送信できませんでした。通信状態を確認してください。</div>
<div class="list"><div class="lh"><span>今回の依頼</span><span id="count" class="count">0台</span></div><div id="items"><div class="empty">まだ登録されていません</div></div></div></div></div>
<script>
const U='https://vqokuktwqrhxsvkwgyug.supabase.co',K='sb_publishable_dMrMp7HYQNxF0KlxrJHEPA_NJBgXR4n',$=x=>document.getElementById(x);let rows=[];
function e(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function t(){let d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function render(){$('count').textContent=rows.length+'台';$('items').innerHTML=rows.length?rows.map(r=>`<div class="item"><div><div class="num">${e(r.n)}</div><div class="meta">次回出庫 ${e(r.d.replace(/^0/,''))} ・ 受付 ${e(r.t)}</div></div><span class="badge">受付</span></div>`).join(''):'<div class="empty">まだ登録されていません</div>'}
$('send').onclick=async()=>{let n=$('radio').value.trim(),d=$('dep').value;if(!n){$('radio').focus();return}if(!d)return;let b=$('send');b.disabled=true;b.textContent='登録中…';$('err').classList.remove('on');$('ok').classList.remove('on');try{let now=new Date().toISOString(),r=await fetch(U+'/rest/v1/wash_receptions',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({radio_number:n,departure_time:d,status:'received',received_at:now,status_changed_at:now})});if(!r.ok)throw Error(await r.text());rows.unshift({n:n,d:d,t:t()});render();$('ok').textContent='無線番号 '+n+' を登録しました。続けて入力できます。';$('ok').classList.add('on');$('radio').value='';setTimeout(()=>$('radio').focus(),100)}catch(x){console.error(x);$('err').classList.add('on')}finally{b.disabled=false;b.textContent='この車両を登録する'}};
render();
</script></body></html>
