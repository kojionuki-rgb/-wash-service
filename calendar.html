<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洗車受付日</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f5;color:#303438;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.w{max-width:460px;margin:auto;padding:18px 14px}.c{background:#fff;border:1px solid #d5d9dc;border-radius:28px;padding:20px 17px}h1{font-size:25px;margin:0}.m{color:#9aa0a6;font-size:13px;margin-top:5px}.head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}.nav{width:44px;height:44px;border:0;border-radius:12px;font-size:20px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:11px;color:#999}.day{min-height:58px;border:1px solid #e2e5e7;border-radius:12px;background:#fff;font-weight:800}.day.on{background:#effaf1;border-color:#bfe1c5}.day small{display:block;font-size:9px;color:#7d877f}.save{width:100%;margin-top:18px;border:0;border-radius:15px;padding:15px;background:#303438;color:#fff;font-size:16px;font-weight:900}#msg{text-align:center;color:#999;font-size:13px;margin-top:10px}</style></head><body><div class="w"><div class="c"><h1>🗓️ 洗車受付日</h1><div class="m">洗車できる日をタップしてください。</div><div class="head"><button id="p" class="nav">‹</button><b id="mo"></b><button id="n" class="nav">›</button></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="g" class="grid"></div><button id="save" class="save">受付可能日を保存</button><div id="msg"></div></div></div>
<script>
const U='https://vqokuktwqrhxsvkwgyug.supabase.co',K='sb_publishable_dMrMp7HYQNxF0KlxrJHEPA_NJBgXR4n',$=x=>document.getElementById(x);let cur=new Date(),sel=new Set();
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
async function api(path,opt={}){let r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function load(){let a=ymd(new Date(cur.getFullYear(),cur.getMonth(),1)),b=ymd(new Date(cur.getFullYear(),cur.getMonth()+1,0));try{let x=await api('wash_available_days?select=wash_date,is_open&wash_date=gte.'+a+'&wash_date=lte.'+b);sel=new Set(x.filter(v=>v.is_open).map(v=>v.wash_date))}catch(e){sel=new Set()}render()}
function render(){$('mo').textContent=cur.getFullYear()+'年 '+(cur.getMonth()+1)+'月';let f=new Date(cur.getFullYear(),cur.getMonth(),1),l=new Date(cur.getFullYear(),cur.getMonth()+1,0),h='';for(let i=0;i<f.getDay();i++)h+='<span></span>';for(let d=1;d<=l.getDate();d++){let s=ymd(new Date(cur.getFullYear(),cur.getMonth(),d)),on=sel.has(s);h+=`<button class="day ${on?'on':''}" data-d="${s}">${d}${on?'<small>受付可</small>':''}</button>`}$('g').innerHTML=h;document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{sel.has(b.dataset.d)?sel.delete(b.dataset.d):sel.add(b.dataset.d);render()})}
$('p').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);load()};$('n').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);load()};
$('save').onclick=async()=>{let a=ymd(new Date(cur.getFullYear(),cur.getMonth(),1)),b=ymd(new Date(cur.getFullYear(),cur.getMonth()+1,0));$('msg').textContent='保存中…';try{await api('wash_available_days?wash_date=gte.'+a+'&wash_date=lte.'+b,{method:'DELETE',headers:{Prefer:'return=minimal'}});if(sel.size)await api('wash_available_days',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify([...sel].map(d=>({wash_date:d,is_open:true,capacity:5})))});$('msg').textContent='保存しました'}catch(e){$('msg').textContent='保存できませんでした'}};load();
</script></body></html>
