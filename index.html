<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f6f3" />
<title>洗車サービス</title>
<style>
:root{
  --charcoal:#303438;
  --muted:#9aa0a6;
  --line:#d9dde1;
  --green:#48d75a;
  --blue:#31a9ef;
  --yellow:#ffd84d;
  --pink:#ff9fbd;
  --bg:#f6f6f3;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--charcoal);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.logo{display:flex;align-items:center;gap:14px}
.logo svg{width:66px;height:52px;flex:0 0 auto}
.logo-title{font-size:34px;font-weight:900;letter-spacing:.01em;white-space:nowrap}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top-action{border:1px solid var(--line);background:#fff;color:var(--charcoal);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:900}

.status-card{border-radius:28px;padding:22px 18px 26px;transition:.18s ease;user-select:none}
.status-label{font-weight:800;font-size:22px}
.status-number{font-size:100px;font-weight:950;line-height:1;text-align:center;letter-spacing:.02em;margin-top:8px}
.depart{text-align:center}
.depart-label{font-size:22px;color:#92989e;font-weight:800}
.depart-time{font-size:68px;font-weight:950;line-height:1.05;margin-top:8px}
.date{text-align:center;color:#92989e;font-size:22px;font-weight:800}

/* 受付入力 */
#editorView{max-width:460px;margin:0 auto;padding:16px 14px 34px}
.editor-card{background:#fff;border:1.5px solid #a3a9af;border-radius:30px;padding:22px 18px 20px}
.editor-head{padding:2px 8px 20px;border-bottom:1px solid var(--line)}
.editor-title{font-size:16px;color:#858b91;font-weight:800;margin-top:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.field label{display:block;font-size:13px;color:#858b91;font-weight:800;margin:0 0 6px 4px}
.field input{width:100%;padding:14px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--charcoal);font-size:18px;font-weight:800;outline:none}
.field input:focus{border-color:#aeb4ba;box-shadow:0 0 0 3px rgba(70,80,90,.08)}
.editor-preview{margin-top:18px}
.editor-preview .status-card{cursor:pointer}
.editor-preview .status-number{font-size:82px}
.editor-preview .depart{padding:22px 0 18px;border-bottom:1px solid var(--line)}
.editor-preview .depart-time{font-size:54px}
.editor-preview .date{font-size:18px;padding-top:18px}
.status-note{text-align:center;color:#a2a8ae;font-size:12px;margin-top:10px}
.show-btn{margin-top:16px;width:100%;border:0;border-radius:15px;padding:15px 16px;background:var(--charcoal);color:#fff;font-size:17px;font-weight:900}
.data-note{text-align:center;color:#a4a9ae;font-size:12px;line-height:1.5;margin:12px 8px 0}

/* 依頼者表示 */
#displayView{min-height:100vh;padding:16px 14px 24px;display:flex;align-items:flex-start;justify-content:center}
.display-card{width:min(430px,100%);background:#fff;border:1.5px solid #a3a9af;border-radius:30px;padding:24px 18px 28px;box-shadow:0 2px 10px rgba(0,0,0,.03);cursor:pointer}
.display-head{padding:2px 8px 22px;border-bottom:1px solid var(--line)}
.display-card .status-card{margin-top:26px}
.display-card .depart{margin-top:26px;padding:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.display-card .date{padding-top:24px}
.return-hint{text-align:center;color:#c0c4c8;font-size:11px;margin-top:18px;letter-spacing:.04em}

/* 受付リスト */
#listView{max-width:560px;margin:0 auto;padding:16px 14px 36px}
.list-card{background:#fff;border:1.5px solid #a3a9af;border-radius:30px;padding:20px 16px}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px 18px;border-bottom:1px solid var(--line)}
.list-title{font-size:28px;font-weight:950}
.back-btn{border:0;background:#eef0f2;color:var(--charcoal);font-weight:900;border-radius:12px;padding:10px 13px}
.list-summary{display:flex;justify-content:space-between;align-items:center;padding:15px 4px 8px;color:#8b9197;font-size:13px;font-weight:800}
.reception-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.row{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;border:1px solid #e2e5e8;border-radius:18px;padding:14px 13px;background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.row:active{transform:scale(.992);background:#f7f8f8}
.dot{width:10px;height:100%;min-height:54px;border-radius:8px}
.row-main{min-width:0}
.row-top{display:flex;align-items:baseline;gap:10px}
.row-num{font-size:27px;font-weight:950}
.row-status{font-size:12px;font-weight:900;color:#777e84}
.row-bottom{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:5px;color:#969ca2;font-size:12px;font-weight:800}
.row-dep{text-align:right}
.row-dep-label{font-size:11px;color:#a0a6ac;font-weight:800}
.row-dep-time{font-size:24px;font-weight:950;line-height:1.1}
.empty{text-align:center;color:#a3a9af;padding:42px 10px;font-weight:800}
.clear-btn{width:100%;margin-top:14px;border:0;background:#f2f3f4;color:#8a9096;border-radius:14px;padding:12px;font-size:13px;font-weight:900}

/* 状態選択 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:20}
.sheet.show{display:flex}
.sheetbox{width:min(430px,100%);background:#fff;border-radius:24px;padding:16px;box-shadow:0 15px 40px rgba(0,0,0,.18)}
.sheetbox h3{margin:4px 4px 14px;font-size:18px}
.opt{width:100%;border:0;border-radius:16px;padding:16px;margin:7px 0;font-size:18px;font-weight:900;text-align:left}
.opt.green{background:#ddf8e2}.opt.blue{background:#dff2ff}.opt.yellow{background:#fff4bd}.opt.cancel{background:#ffd6e3}

@media(max-width:380px){
  .logo-title{font-size:29px}.logo svg{width:58px;height:46px}
  .display-card .status-number{font-size:88px}.display-card .depart-time{font-size:60px}
  .form-grid{grid-template-columns:1fr}
}

.list-tools{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:8px;
  align-items:center;
  margin:14px 0 10px;
}
.day-btn{
  border:1px solid var(--line);
  background:#fff;
  color:var(--charcoal);
  border-radius:12px;
  padding:10px 12px;
  font-weight:900;
  min-width:44px;
}
.date-pick{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  background:#fff;
  color:var(--charcoal);
  font-weight:900;
  text-align:center;
}
.filter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}
.filter-grid input,.filter-grid select{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  background:#fff;
  color:var(--charcoal);
  font-size:14px;
  font-weight:800;
}
.filter-caption{
  color:#a0a6ac;
  font-size:11px;
  font-weight:800;
  margin:0 2px 4px;
}
.list-stats{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:8px 0 2px;
}
.stat-pill{
  border-radius:999px;
  padding:6px 9px;
  font-size:11px;
  font-weight:900;
  background:#f0f2f3;
}
@media(max-width:380px){
  .filter-grid{grid-template-columns:1fr}
}

</style>
</head>
<body>

<main id="editorView">
  <section class="editor-card">
    <div class="editor-head">
      <div class="topbar">
        <div class="logo">
          <svg viewBox="0 0 110 82" aria-hidden="true">
            <g fill="#303438">
              <path d="M23 35h58c6 0 11 5 11 11v19c0 6-5 11-11 11H23c-6 0-11-5-11-11V46c0-6 5-11 11-11Z"/>
              <path d="M28 34 36 18c2-4 6-7 11-7h19c5 0 9 3 11 7l8 16H28Zm10-5h37l-5-10c-1-2-3-3-5-3H48c-2 0-4 1-5 3l-5 10Z"/>
              <rect x="20" y="70" width="13" height="9" rx="3"/><rect x="71" y="70" width="13" height="9" rx="3"/>
              <rect x="18" y="51" width="20" height="10" rx="5" fill="#fff"/><rect x="66" y="51" width="20" height="10" rx="5" fill="#fff"/>
              <path d="M92 7c2 8 5 11 13 13-8 2-11 5-13 13-2-8-5-11-13-13 8-2 11-5 13-13Z"/>
              <path d="M76 0c1.3 5 3.3 7 8.3 8.3-5 1.3-7 3.3-8.3 8.3-1.3-5-3.3-7-8.3-8.3C72.7 7 74.7 5 76 0Z"/>
            </g>
          </svg>
          <div class="logo-title">洗車サービス</div>
        </div>
        <button id="listBtn" class="top-action">受付リスト</button>
      </div>
    </div>

    <div class="editor-title">受付情報を入力</div>
    <div class="form-grid">
      <div class="field">
        <label for="numInput">無線番号</label>
        <input id="numInput" inputmode="numeric" autocomplete="off" placeholder="無線番号" value="" />
      </div>
      <div class="field">
        <label for="depInput">次回出庫</label>
        <input id="depInput" type="time" value="06:30" />
      </div>
    </div>

    <div class="editor-preview">
      <div id="editorStatusCard" class="status-card" title="タップで状態を変更">
        <div class="status-label">無線番号</div>
        <div id="editorRadioNumber" class="status-number">—</div>
      </div>
      <div class="status-note">無線番号カードをタップして状態変更</div>
      <div class="depart">
        <div class="depart-label">次回出庫</div>
        <div id="editorDeparture" class="depart-time">6:30</div>
      </div>
      <div id="editorDate" class="date"></div>
    </div>

    <button id="showBtn" class="show-btn">受付して依頼者に見せる</button>
    <div class="data-note">受付データはクラウドに保存され、iPhone・Macなど複数端末で共有できます。</div>
  </section>
</main>

<main id="displayView" class="hidden">
  <section id="displayCard" class="display-card">
    <div class="display-head">
      <div class="logo">
        <svg viewBox="0 0 110 82" aria-hidden="true">
          <g fill="#303438">
            <path d="M23 35h58c6 0 11 5 11 11v19c0 6-5 11-11 11H23c-6 0-11-5-11-11V46c0-6 5-11 11-11Z"/>
            <path d="M28 34 36 18c2-4 6-7 11-7h19c5 0 9 3 11 7l8 16H28Zm10-5h37l-5-10c-1-2-3-3-5-3H48c-2 0-4 1-5 3l-5 10Z"/>
            <rect x="20" y="70" width="13" height="9" rx="3"/><rect x="71" y="70" width="13" height="9" rx="3"/>
            <rect x="18" y="51" width="20" height="10" rx="5" fill="#fff"/><rect x="66" y="51" width="20" height="10" rx="5" fill="#fff"/>
            <path d="M92 7c2 8 5 11 13 13-8 2-11 5-13 13-2-8-5-11-13-13 8-2 11-5 13-13Z"/>
            <path d="M76 0c1.3 5 3.3 7 8.3 8.3-5 1.3-7 3.3-8.3 8.3-1.3-5-3.3-7-8.3-8.3C72.7 7 74.7 5 76 0Z"/>
          </g>
        </svg>
        <div class="logo-title">洗車サービス</div>
      </div>
    </div>

    <div id="displayStatusCard" class="status-card">
      <div class="status-label">無線番号</div>
      <div id="displayRadioNumber" class="status-number">—</div>
    </div>
    <div class="depart">
      <div class="depart-label">次回出庫</div>
      <div id="displayDeparture" class="depart-time">6:30</div>
    </div>
    <div id="displayDate" class="date"></div>
    <div class="return-hint">画面をタップすると受付画面に戻ります</div>
  </section>
</main>

<main id="listView" class="hidden">
  <section class="list-card">
    <div class="list-head">
      <div>
        <div class="list-title">受付リスト</div>
        <div id="listDate" style="color:#9aa0a6;font-size:13px;font-weight:800;margin-top:4px"></div>
      </div>
      <button id="backBtn" class="back-btn">戻る</button>
    </div>
    <div class="list-tools">
      <button id="prevDayBtn" class="day-btn" aria-label="前日">‹</button>
      <input id="listDateInput" class="date-pick" type="date" />
      <button id="nextDayBtn" class="day-btn" aria-label="翌日">›</button>
    </div>

    <div class="filter-grid">
      <div>
        <div class="filter-caption">無線番号で検索</div>
        <input id="searchInput" type="search" inputmode="numeric" placeholder="例：1234" />
      </div>
      <div>
        <div class="filter-caption">状態で絞り込み</div>
        <select id="statusFilter">
          <option value="all">すべて</option>
          <option value="received">受付</option>
          <option value="paid">支払い済み</option>
          <option value="unpaid">未収</option>
          <option value="cancelled">キャンセル</option>
        </select>
      </div>
    </div>

    <div id="listStats" class="list-stats"></div>

    <div class="list-summary">
      <span><span id="countText">0件</span><span id="totalAmount" style="margin-left:10px;color:#a7adb2;font-size:13px;font-weight:700">合計 0円</span></span>
      <span>新しい順</span>
    </div>
    <div id="receptionList" class="reception-list"></div>
  </section>
</main>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="sheetbox">
    <h3>状態を変更</h3>
    <button class="opt green" data-status="received">受付（緑）</button>
    <button class="opt blue" data-status="paid">支払い済み（青）</button>
    <button class="opt yellow" data-status="unpaid">未収（黄）</button>
    <button class="opt cancel" data-status="cancelled">キャンセル（ピンク）</button>
  </div>
</div>



<script>
const SUPABASE_URL='https://vqokuktwqrhxsvkwgyug.supabase.co';
const SUPABASE_KEY='sb_publishable_dMrMp7HYQNxF0KlxrJHEPA_NJBgXR4n';
const localKey='washServiceV9Local';

const colors={
  received:'#48d75a',
  paid:'#31a9ef',
  unpaid:'#ffd84d',
  cancelled:'#ff9fbd'
};
const labels={
  received:'受付',
  paid:'支払い済み',
  unpaid:'未収',
  cancelled:'キャンセル'
};
const $=id=>document.getElementById(id);

let local=JSON.parse(localStorage.getItem(localKey)||'{}');
if(!local.departure) local.departure='06:30';

let state={
  id:null,
  radioNumber:'',
  departure:local.departure,
  status:'received',
  receivedAt:null,
  statusChangedAt:null
};

let selectedListDate=todayYmd();
let dayRows=[];

function saveLocal(){
  local.departure=state.departure;
  localStorage.setItem(localKey,JSON.stringify(local));
}

function headers(extra={}){
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type':'application/json',
    ...extra
  };
}

async function api(path,options={}){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{
    ...options,
    headers:headers(options.headers||{})
  });
  if(!res.ok){
    const msg=await res.text();
    throw new Error(msg||`HTTP ${res.status}`);
  }
  const txt=await res.text();
  return txt ? JSON.parse(txt) : null;
}

function ymdFromDate(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayYmd(){ return ymdFromDate(new Date()); }

function localDateFromYmd(ymd){
  const [y,m,d]=ymd.split('-').map(Number);
  return new Date(y,m-1,d,0,0,0,0);
}

function jpDate(d=new Date()){
  const wd=['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 (${wd})`;
}

function jpDateFromYmd(ymd){
  return jpDate(localDateFromYmd(ymd));
}

function timeLabel(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function shortTime(t){ return (t||'').replace(/^0/,''); }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function applyStatus(card,status=state.status){
  card.style.background=colors[status]||colors.received;
  card.style.color=(status==='unpaid'||status==='cancelled')?'#303438':'#fff';
}

function render(){
  $('numInput').value=state.radioNumber;
  $('depInput').value=state.departure;
  $('editorRadioNumber').textContent=state.radioNumber||'—';
  $('displayRadioNumber').textContent=state.radioNumber||'—';
  $('editorDeparture').textContent=shortTime(state.departure);
  $('displayDeparture').textContent=shortTime(state.departure);
  $('editorDate').textContent=jpDate();
  $('displayDate').textContent=jpDate();
  applyStatus($('editorStatusCard'));
  applyStatus($('displayStatusCard'));
  saveLocal();
}

function syncInputs(){
  state.radioNumber=$('numInput').value.trim();
  if($('depInput').value) state.departure=$('depInput').value;
  render();
}

function newReception(){
  state={
    id:null,
    radioNumber:'',
    departure:local.departure||'06:30',
    status:'received',
    receivedAt:null,
    statusChangedAt:null
  };
  render();
  $('numInput').value='';
  $('editorRadioNumber').textContent='—';
  $('displayRadioNumber').textContent='—';
}

async function insertReception(){
  const now=new Date().toISOString();
  const rows=await api('wash_receptions',{
    method:'POST',
    headers:{'Prefer':'return=representation'},
    body:JSON.stringify({
      radio_number:state.radioNumber,
      departure_time:state.departure,
      status:state.status,
      received_at:now,
      status_changed_at:now
    })
  });
  const r=rows&&rows[0];
  if(r){
    state.id=r.id;
    state.receivedAt=r.received_at;
    state.statusChangedAt=r.status_changed_at;
  }
}

async function updateCurrentRecord(){
  if(!state.id) return;
  const now=new Date().toISOString();
  state.statusChangedAt=now;
  await api(`wash_receptions?id=eq.${encodeURIComponent(state.id)}`,{
    method:'PATCH',
    headers:{'Prefer':'return=minimal'},
    body:JSON.stringify({
      radio_number:state.radioNumber,
      departure_time:state.departure,
      status:state.status,
      status_changed_at:now
    })
  });
}

function openSheet(){
  $('sheet').classList.add('show');
  $('sheet').setAttribute('aria-hidden','false');
}
function closeSheet(){
  $('sheet').classList.remove('show');
  $('sheet').setAttribute('aria-hidden','true');
}

function dateRangeForYmd(ymd){
  const start=localDateFromYmd(ymd);
  const end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+1,0,0,0,0);
  return [start.toISOString(),end.toISOString()];
}

async function loadDay(ymd){
  const [start,end]=dateRangeForYmd(ymd);
  const q=`wash_receptions?select=id,radio_number,departure_time,status,received_at,status_changed_at&received_at=gte.${encodeURIComponent(start)}&received_at=lt.${encodeURIComponent(end)}&order=received_at.desc`;
  return await api(q,{method:'GET'});
}

function changeListDate(days){
  const d=localDateFromYmd(selectedListDate);
  d.setDate(d.getDate()+days);
  selectedListDate=ymdFromDate(d);
  $('listDateInput').value=selectedListDate;
  refreshList();
}

async function showList(){
  selectedListDate=todayYmd();
  $('listDateInput').value=selectedListDate;
  $('searchInput').value='';
  $('statusFilter').value='all';

  $('editorView').classList.add('hidden');
  $('displayView').classList.add('hidden');
  $('listView').classList.remove('hidden');
  $('receptionList').innerHTML='<div class="empty">読み込み中…</div>';
  window.scrollTo(0,0);

  await refreshList();
}

async function refreshList(){
  $('listDate').textContent=jpDateFromYmd(selectedListDate);
  $('receptionList').innerHTML='<div class="empty">読み込み中…</div>';

  try{
    dayRows=await loadDay(selectedListDate);
    applyListFilters();
  }catch(e){
    $('receptionList').innerHTML='<div class="empty">リストを読み込めませんでした</div>';
    $('countText').textContent='0件';
    if($('totalAmount')) $('totalAmount').textContent='合計 0円';
    $('listStats').innerHTML='';
    console.error(e);
  }
}

function applyListFilters(){
  const q=$('searchInput').value.trim();
  const status=$('statusFilter').value;

  const filtered=dayRows.filter(r=>{
    const radioOk=!q || String(r.radio_number||'').includes(q);
    const statusOk=status==='all' || r.status===status;
    return radioOk && statusOk;
  });

  renderListStats(dayRows);
  renderRows(filtered);
}

function renderListStats(rows){
  const counts={
    all:rows.length,
    received:0,
    paid:0,
    unpaid:0,
    cancelled:0
  };
  rows.forEach(r=>{
    if(counts[r.status]!==undefined) counts[r.status]++;
  });

  $('listStats').innerHTML=`
    <span class="stat-pill">全 ${counts.all}</span>
    <span class="stat-pill" style="background:#ddf8e2">受付 ${counts.received}</span>
    <span class="stat-pill" style="background:#dff2ff">済 ${counts.paid}</span>
    <span class="stat-pill" style="background:#fff4bd">未収 ${counts.unpaid}</span>
    <span class="stat-pill" style="background:#ffd6e3">取消 ${counts.cancelled}</span>
  `;
}

function renderRows(rows){
  $('countText').textContent=`${rows.length}件`;
  const billableCount=rows.filter(r=>r.status!=='cancelled').length;
  $('totalAmount').textContent=`合計 ${(billableCount*1300).toLocaleString('ja-JP')}円`;
  const box=$('receptionList');
  box.innerHTML='';

  if(!rows.length){
    box.innerHTML='<div class="empty">該当する受付はありません</div>';
    return;
  }

  rows.forEach(r=>{
    const wrap=document.createElement('div');
    wrap.style.marginBottom='10px';

    const el=document.createElement('button');
    el.type='button';
    el.className='row';
    el.style.width='100%';
    el.style.textAlign='left';
    el.style.font='inherit';
    el.style.color='inherit';
    el.style.appearance='none';
    el.style.webkitAppearance='none';
    el.innerHTML=`
      <div class="dot" style="background:${colors[r.status]||colors.received}"></div>
      <div class="row-main">
        <div class="row-top">
          <div class="row-num">${escapeHtml(r.radio_number)}</div>
          <div class="row-status">${labels[r.status]||'受付'}</div>
        </div>
        <div class="row-bottom">
          <span>受付 ${timeLabel(r.received_at)}</span>
          <span>変更 ${timeLabel(r.status_changed_at||r.received_at)}</span>
        </div>
      </div>
      <div class="row-dep">
        <div class="row-dep-label">次回出庫</div>
        <div class="row-dep-time">${shortTime((r.departure_time||'').slice(0,5))}</div>
      </div>`;

    const actions=document.createElement('div');
    actions.style.display='none';
    actions.style.gridTemplateColumns='repeat(2,1fr)';
    actions.style.gap='8px';
    actions.style.padding='10px 4px 2px';
    actions.innerHTML=`
      <button type="button" data-s="received" style="border:0;border-radius:13px;padding:13px 8px;background:#ddf8e2;font-weight:900;font-size:14px">受付</button>
      <button type="button" data-s="paid" style="border:0;border-radius:13px;padding:13px 8px;background:#dff2ff;font-weight:900;font-size:14px">支払い済み</button>
      <button type="button" data-s="unpaid" style="border:0;border-radius:13px;padding:13px 8px;background:#fff4bd;font-weight:900;font-size:14px">未収</button>
      <button type="button" data-s="cancelled" style="border:0;border-radius:13px;padding:13px 8px;background:#ffd6e3;font-weight:900;font-size:14px">キャンセル</button>`;

    el.addEventListener('click',()=>{
      const open=actions.style.display==='grid';
      document.querySelectorAll('.list-inline-actions').forEach(a=>a.style.display='none');
      actions.style.display=open?'none':'grid';
    });
    actions.classList.add('list-inline-actions');

    actions.querySelectorAll('[data-s]').forEach(btn=>{
      btn.addEventListener('click',async e=>{
        e.stopPropagation();
        const next=btn.dataset.s;
        const old=btn.textContent;
        btn.disabled=true;
        btn.textContent='保存中…';
        try{
          const now=new Date().toISOString();
          await api(`wash_receptions?id=eq.${encodeURIComponent(r.id)}`,{
            method:'PATCH',
            headers:{'Prefer':'return=minimal'},
            body:JSON.stringify({status:next,status_changed_at:now})
          });
          r.status=next;
          r.status_changed_at=now;
          if(state.id===r.id){
            state.status=next;
            state.statusChangedAt=now;
            render();
          }
          await refreshList();
        }catch(err){
          console.error(err);
          alert('状態を保存できませんでした。通信状態を確認してください。');
          btn.disabled=false;
          btn.textContent=old;
        }
      });
    });

    wrap.appendChild(el);
    wrap.appendChild(actions);
    box.appendChild(wrap);
  });
}
$('editorStatusCard').addEventListener('click',openSheet);
$('numInput').addEventListener('focus',e=>e.target.select());
$('numInput').addEventListener('input',syncInputs);
$('depInput').addEventListener('change',syncInputs);

document.querySelectorAll('[data-status]').forEach(btn=>btn.addEventListener('click',async()=>{
  state.status=btn.dataset.status;
  render();
  closeSheet();
  try{
    await updateCurrentRecord();
  }catch(e){
    alert('状態を保存できませんでした。通信状態を確認してください。');
    console.error(e);
  }
}));

$('sheet').addEventListener('click',e=>{
  if(e.target===$('sheet')) closeSheet();
});

$('showBtn').addEventListener('click',async()=>{
  syncInputs();
  if(!state.radioNumber){
    $('numInput').focus();
    return;
  }

  const btn=$('showBtn');
  const old=btn.textContent;
  btn.disabled=true;
  btn.textContent='保存中…';

  try{
    if(!state.id) await insertReception();
    else await updateCurrentRecord();

    render();
    $('editorView').classList.add('hidden');
    $('displayView').classList.remove('hidden');
    window.scrollTo(0,0);
  }catch(e){
    alert('受付データを保存できませんでした。通信状態を確認してください。');
    console.error(e);
  }finally{
    btn.disabled=false;
    btn.textContent=old;
  }
});

$('displayCard').addEventListener('click',()=>{
  $('displayView').classList.add('hidden');
  $('editorView').classList.remove('hidden');
  newReception();
  window.scrollTo(0,0);
});

$('listBtn').addEventListener('click',showList);

$('backBtn').addEventListener('click',()=>{
  $('listView').classList.add('hidden');
  $('displayView').classList.add('hidden');
  $('editorView').classList.remove('hidden');
  window.scrollTo(0,0);
});

$('prevDayBtn').addEventListener('click',()=>changeListDate(-1));
$('nextDayBtn').addEventListener('click',()=>changeListDate(1));

$('listDateInput').addEventListener('change',()=>{
  if(!$('listDateInput').value) return;
  selectedListDate=$('listDateInput').value;
  refreshList();
});

$('searchInput').addEventListener('input',applyListFilters);
$('statusFilter').addEventListener('change',applyListFilters);

async function loadLatestReceptionOnStart(){
  // LINE側など別画面から登録された「今日の最新受付」を、
  // 管理画面を開いた時点で自動的にメインカードへ反映する。
  try{
    const rows=await loadDay(todayYmd());
    if(rows && rows.length){
      const r=rows[0];
      state={
        id:r.id,
        radioNumber:String(r.radio_number||''),
        departure:(r.departure_time||local.departure||'06:30').slice(0,5),
        status:r.status||'received',
        receivedAt:r.received_at||null,
        statusChangedAt:r.status_changed_at||r.received_at||null
      };
      render();
    }else{
      newReception();
    }
  }catch(e){
    console.error(e);
    newReception();
  }
}

loadLatestReceptionOnStart();
</script>
